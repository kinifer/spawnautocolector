name: Build mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Instalar JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Dar permissao de execucao ao gradlew
        run: chmod +x ./gradlew

      - name: Compilar o mod
        run: ./gradlew build

      - name: Subir o .jar compilado como artefato
        uses: actions/upload-artifact@v4
        with:
          name: spawner-autocollector-jar
          path: build/libs/*.jar
