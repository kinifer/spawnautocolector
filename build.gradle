plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

repositories {
    // Loom ja adiciona os repositorios essenciais do Minecraft/Fabric.
    // So precisamos de algo extra se o Baritone nao estiver como jar local.
}

dependencies {
    // Para mudar as versoes, edite gradle.properties
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // ---- BARITONE ----
    // Coloque o mesmo baritone-api-fabric-26.1.jar que voce ja usa no
    // jogo dentro da pasta libs/ deste projeto.
    implementation files('libs/baritone-api-fabric-26.1.jar')
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName

    from("LICENSE") {
        rename { "${it}_$projectName" }
    }
}
