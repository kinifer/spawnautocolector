# Propriedades do Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Versoes confirmadas no repositorio oficial FabricMC/fabric-example-mod,
# branch 26.1.2 (a mais proxima da sua build 26.1 disponivel publicamente).
# Se sua build for exatamente "26.1" (sem o ".2"), tente essas mesmas
# versoes primeiro; se o loom reclamar, ajuste minecraft_version pra "26.1".
minecraft_version=26.1.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT
fabric_version=0.155.2+26.1.2

# Informacoes do seu mod
version=1.0.0
group=com.example

# Se o build der erro "release version 25 not supported", instale o
# JDK 25 (ex: Eclipse Temurin) e descomente a linha abaixo, trocando
# pelo caminho real onde ele foi instalado no seu PC.
# Exemplo no Windows (repare nas barras duplas \\):
#org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-25.0.x-hotspot
